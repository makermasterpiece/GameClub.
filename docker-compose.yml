services:
  postgres:
    image: postgres:16-alpine
    container_name: gameclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameclub
      POSTGRES_USER: gameclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env file}
    ports:
      - "5432:5432"
    volumes:
      - gameclub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameclub -d gameclub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gameclub-postgres-data:
